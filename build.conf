# Shared settings for build.sh / flash.sh / monitor.sh

ARDUINO_CLI="/Applications/Arduino IDE.app/Contents/Resources/app/lib/backend/resources/arduino-cli"

FQBN="esp8266:esp8266:generic:xtal=80,ResetMethod=nodemcu,CrystalFreq=26,FlashFreq=40,FlashMode=dout,eesz=4M1M,baud=115200"

# Serial port. Leave empty to auto-detect the first /dev/cu.usbserial-* device,
# or override per-run with:  PORT=/dev/cu.something ./flash.sh
PORT="/dev/cu.usbserial-A5069RR4"

# Baud rate the sketch calls Serial.begin() with, used by monitor.sh
MONITOR_BAUD="115200"
