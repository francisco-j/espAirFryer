; ESPFryer – ESP8266 air fryer controller
;
; Board settings below are the arduino-cli FQBN this project was built with
; before the PlatformIO move, translated key by key:
;
;   esp8266:esp8266:generic:xtal=80,ResetMethod=nodemcu,CrystalFreq=26,
;   FlashFreq=40,FlashMode=dout,eesz=4M1M,baud=115200
;
; CrystalFreq=26 is the ESP8266 default and needs no key here.

[env:espfryer]
platform  = espressif8266@~4.2.1   ; Arduino core 3.1.x, as used before the move
board     = esp12e                 ; generic 4MB module
framework = arduino

board_build.f_cpu      = 80000000L          ; xtal=80
board_build.f_flash    = 40000000L          ; FlashFreq=40
board_build.flash_mode = dout               ; FlashMode=dout
board_build.ldscript   = eagle.flash.4m1m.ld ; eesz=4M1M

upload_resetmethod = nodemcu
upload_speed       = 115200
; Comment out upload_port/monitor_port to let PlatformIO auto-detect the board.
upload_port  = /dev/cu.usbserial-A5069RR4
monitor_port = /dev/cu.usbserial-A5069RR4

monitor_speed = 115200

; Wire ships with the core; only the LCD driver is external.
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4
